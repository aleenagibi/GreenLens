<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GreenLens routing favicon">
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8AF36A"/>
      <stop offset="0.52" stop-color="#19D58B"/>
      <stop offset="1" stop-color="#00B98B"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D58B"/>
      <stop offset="1" stop-color="#B5F52D"/>
    </linearGradient>
  </defs>
  <!-- Three open evaluation arcs -->
  <g fill="none" stroke="url(#arc)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M132 165 A145 145 0 0 1 263 91 L263 139 A97 97 0 0 0 164 190"/>
    <path d="M91 210 A194 194 0 0 1 263 43 L263 76 A227 227 0 0 0 57 257" opacity="0"/>
    <path d="M83 219 A190 190 0 0 1 263 54 L263 91 A153 153 0 0 0 119 224"/>
    <path d="M83 293 A190 190 0 0 0 263 458 L263 421 A153 153 0 0 1 119 288"/>
    <path d="M132 347 A145 145 0 0 0 263 421 L263 373 A97 97 0 0 1 164 322"/>
  </g>
  <!-- Incoming signal and decision hub -->
  <path d="M48 256 H224" fill="none" stroke="url(#route)" stroke-width="13" stroke-linecap="round"/>
  <circle cx="246" cy="256" r="25" fill="#071B16" stroke="url(#arc)" stroke-width="11"/>
  <circle cx="246" cy="256" r="8" fill="#B5F52D"/>
  <!-- Three model routes -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 246 H326 C357 246 359 205 394 205 H439" stroke="#168E78" stroke-width="11"/>
    <path d="M270 256 H440" stroke="url(#route)" stroke-width="13"/>
    <path d="M270 266 H326 C357 266 359 307 394 307 H439" stroke="#168E78" stroke-width="11"/>
  </g>
  <!-- Destination nodes -->
  <g fill="#071B16" stroke-width="10">
    <circle cx="454" cy="205" r="13" stroke="#168E78"/>
    <circle cx="454" cy="256" r="15" stroke="#B5F52D"/>
    <circle cx="454" cy="307" r="13" stroke="#168E78"/>
  </g>
</svg>
